<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Offline | Humu Kabba Variety Vault</title>
  <meta name="theme-color" content="#0a0a0c">
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0c;
      color: #f3efe6;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .offline-card {
      text-align: center;
      max-width: 400px;
    }
    .offline-icon {
      font-size: 5rem;
      margin-bottom: 24px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: #d4af37;
      margin-bottom: 12px;
    }
    p {
      color: rgba(243,239,230,0.6);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .wa-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(37,211,102,0.12);
      border: 1px solid rgba(37,211,102,0.3);
      color: #25d366;
      border-radius: 14px;
      padding: 14px 24px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s;
      margin-bottom: 14px;
      display: block;
    }
    .wa-btn:hover { background: rgba(37,211,102,0.2); }
    .retry-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 12px 24px;
      color: rgba(243,239,230,0.6);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
    }
    .retry-btn:hover { border-color:rgba(212,175,55,0.3);color:#d4af37; }
    .brand-hint {
      margin-top: 36px;
      font-size: 0.75rem;
      color: rgba(243,239,230,0.25);
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon">📶</div>
    <h1>You're Offline</h1>
    <p>It looks like you've lost your internet connection. No worries — you can still reach us on WhatsApp to browse, order, or ask about our products!</p>

    <a class="wa-btn" href="https://wa.me/23277416008?text=Hi! I want to browse your collection and place an order." target="_blank">
      💬 Order via WhatsApp
    </a>

    <button class="retry-btn" onclick="window.location.reload()">
      🔄 Try Again
    </button>

    <div class="brand-hint">Humu Kabba Variety Vault · Aberdeen, Freetown · +232 77 416008</div>
  </div>
</body>
</html>
