<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track My Order | Humu Kabba Variety Vault</title>
  <meta name="description" content="Track your order from Humu Kabba Variety Vault. Enter your phone number or order reference to see your order status.">
  <meta name="theme-color" content="#0a0a0c">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Humu Vault">
  <link rel="apple-touch-icon" href="assets/logo.jpg">
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      background: #0a0a0c;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #f3efe6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    :root {
      --gold: #d4af37;
      --bg: #0a0a0c;
      --card: rgba(255,255,255,0.03);
      --border: rgba(255,255,255,0.08);
      --text: #f3efe6;
      --text-muted: rgba(243,239,230,0.5);
    }

    /* Nav */
    .track-nav {
      background: rgba(10,10,12,0.96);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(212,175,55,0.15);
      height: 68px;
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 16px;
    }
    .track-nav .nav-logo { display:flex;align-items:center;gap:10px;text-decoration:none; }
    .track-nav .nav-logo img { width:38px;height:38px;border-radius:50%;object-fit:cover;border:1px solid rgba(212,175,55,0.3); }
    .track-nav .nav-brand { font-family:'Playfair Display',serif;font-size:1rem;color:#d4af37; }
    .nav-spacer { flex:1; }
    .btn-nav-link {
      display:flex;align-items:center;gap:6px;text-decoration:none;
      color:rgba(243,239,230,0.6);font-size:0.8rem;transition:color 0.2s;
      background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);
      border-radius:10px;padding:8px 14px;
    }
    .btn-nav-link:hover { color:#d4af37;border-color:rgba(212,175,55,0.3); }

    /* Main */
    .track-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px 100px;
    }
    .track-container {
      width: 100%;
      max-width: 560px;
    }
    .track-header { text-align:center;margin-bottom:36px; }
    .track-icon { font-size:3rem;color:var(--gold);margin-bottom:16px; }
    .track-title { font-family:'Playfair Display',serif;font-size:2rem;color:var(--text);margin:0 0 8px; }
    .track-subtitle { font-size:0.9rem;color:var(--text-muted);margin:0; }

    /* Search Card */
    .track-search-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      margin-bottom: 24px;
    }
    .search-tabs {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .search-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text-muted);
      background: none;
      border: none;
    }
    .search-tab.active { background: rgba(212,175,55,0.15);color:var(--gold);font-weight:600; }

    .search-pane { display:none; }
    .search-pane.active { display:block; }

    .input-group { position:relative;margin-bottom:16px; }
    .input-group i { position:absolute;left:16px;top:50%;transform:translateY(-50%);color:rgba(243,239,230,0.3);font-size:0.9rem; }
    .track-input {
      width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--border);
      border-radius:12px;padding:14px 16px 14px 44px;color:var(--text);
      font-family:'Plus Jakarta Sans',sans-serif;font-size:0.95rem;outline:none;
      transition:border-color 0.2s;
    }
    .track-input:focus { border-color:rgba(212,175,55,0.5); }
    .track-input::placeholder { color:rgba(243,239,230,0.3); }

    .btn-track {
      width:100%;background:linear-gradient(135deg,#d4af37,#b8962e);
      color:#0a0a0c;border:none;border-radius:12px;padding:14px;
      font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:0.95rem;
      cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
      transition:opacity 0.2s;
    }
    .btn-track:hover { opacity:0.9; }
    .btn-track:disabled { opacity:0.4;cursor:not-allowed; }

    /* Results */
    .track-results { display:none; }
    .track-results.show { display:block; }

    /* Order Card */
    .order-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
    }
    .order-card-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .order-ref { font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--text); }
    .order-ref span { font-size:0.8rem;color:var(--gold);font-weight:700;letter-spacing:1px; }
    .order-status-badge {
      display:inline-flex;align-items:center;gap:6px;
      padding:6px 14px;border-radius:20px;font-size:0.8rem;font-weight:600;
    }
    .status-new { background:rgba(99,102,241,0.15);color:#818cf8; }
    .status-confirmed { background:rgba(212,175,55,0.15);color:#d4af37; }
    .status-preparing { background:rgba(255,165,0,0.15);color:#ffa500; }
    .status-dispatched { background:rgba(37,211,102,0.15);color:#25d366; }
    .status-delivered { background:rgba(37,211,102,0.2);color:#25d366; }
    .status-cancelled { background:rgba(231,76,60,0.15);color:#e74c3c; }

    .order-card-body { padding: 24px; }

    /* Progress Tracker */
    .order-progress {
      display: flex;
      justify-content: space-between;
      position: relative;
      margin-bottom: 28px;
      padding-top: 8px;
    }
    .order-progress::before {
      content: '';
      position: absolute;
      top: 20px;
      left: 10%;
      right: 10%;
      height: 2px;
      background: var(--border);
    }
    .progress-line {
      position: absolute;
      top: 20px;
      left: 10%;
      height: 2px;
      background: linear-gradient(90deg,#d4af37,#25d366);
      transition: width 0.6s ease;
    }
    .progress-step { display:flex;flex-direction:column;align-items:center;gap:8px;z-index:1;flex:1;max-width:80px; }
    .progress-step-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      color: var(--text-muted);
      transition: all 0.4s;
    }
    .progress-step.done .progress-step-icon { background:rgba(37,211,102,0.2);border-color:#25d366;color:#25d366; }
    .progress-step.active .progress-step-icon { background:rgba(212,175,55,0.2);border-color:var(--gold);color:var(--gold);box-shadow:0 0 12px rgba(212,175,55,0.3); }
    .progress-step-label { font-size:0.68rem;color:var(--text-muted);text-align:center;line-height:1.3; }
    .progress-step.done .progress-step-label, .progress-step.active .progress-step-label { color:var(--text); }

    /* Order Details */
    .order-details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    @media (max-width: 480px) { .order-details-grid { grid-template-columns: 1fr; } }
    .detail-item { background:rgba(255,255,255,0.02);border-radius:10px;padding:12px; }
    .detail-label { font-size:0.68rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin-bottom:4px; }
    .detail-value { font-size:0.85rem;color:var(--text);font-weight:600; }

    /* Items List */
    .order-items-title { font-size:0.78rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin:0 0 10px; }
    .order-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 0.85rem;
    }
    .order-item-row:last-child { border-bottom:none; }
    .order-item-name { color:var(--text); }
    .order-item-price { color:var(--gold);font-weight:600;white-space:nowrap; }

    /* Order Total */
    .order-total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0 0;
      margin-top: 8px;
      border-top: 1px solid var(--border);
    }
    .order-total-label { font-size:0.85rem;font-weight:600;color:var(--text); }
    .order-total-sle { font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--gold); }

    /* Contact Buttons */
    .order-contact-btns { display:flex;gap:10px;margin-top:16px; }
    .btn-wa-contact {
      flex:1;background:rgba(37,211,102,0.1);border:1px solid rgba(37,211,102,0.3);
      color:#25d366;border-radius:12px;padding:12px;font-family:'Plus Jakarta Sans',sans-serif;
      font-size:0.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
      text-decoration:none;transition:background 0.2s;
    }
    .btn-wa-contact:hover { background:rgba(37,211,102,0.2); }
    .btn-call-contact {
      background:rgba(255,255,255,0.05);border:1px solid var(--border);
      color:var(--text-muted);border-radius:12px;padding:12px 16px;
      font-size:0.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
      text-decoration:none;transition:all 0.2s;white-space:nowrap;
    }
    .btn-call-contact:hover { color:var(--text);border-color:rgba(255,255,255,0.2); }

    /* No results */
    .no-results {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 24px;
      text-align: center;
    }
    .no-results-icon { font-size:2.5rem;color:rgba(212,175,55,0.2);margin-bottom:16px; }
    .no-results h3 { font-family:'Playfair Display',serif;color:rgba(243,239,230,0.5);margin:0 0 8px; }
    .no-results p { font-size:0.85rem;color:var(--text-muted);margin:0 0 20px; }
    .btn-wa-help {
      display:inline-flex;align-items:center;gap:8px;
      background:rgba(37,211,102,0.1);border:1px solid rgba(37,211,102,0.3);
      color:#25d366;border-radius:12px;padding:12px 20px;
      font-family:'Plus Jakarta Sans',sans-serif;font-size:0.85rem;text-decoration:none;
      transition:background 0.2s;
    }
    .btn-wa-help:hover { background:rgba(37,211,102,0.2); }

    /* Help tip */
    .help-tip {
      background: rgba(212,175,55,0.05);
      border: 1px solid rgba(212,175,55,0.15);
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.6;
    }
    .help-tip a { color:var(--gold);text-decoration:none; }
    .help-tip a:hover { text-decoration:underline; }

    /* Mobile Bottom Nav */
    .bottom-nav-bar { display:none;position:fixed;bottom:0;left:0;right:0;z-index:999;background:rgba(10,10,12,0.97);border-top:1px solid rgba(212,175,55,0.15);height:64px;align-items:center;justify-content:space-around;padding:0 8px; }
    @media (max-width:768px) { .bottom-nav-bar { display:flex; } body { padding-bottom:70px; } }
    .bottom-nav-item { display:flex;flex-direction:column;align-items:center;gap:3px;color:rgba(243,239,230,0.45);text-decoration:none;cursor:pointer;transition:color 0.2s;position:relative;padding:4px 12px; }
    .bottom-nav-item.active, .bottom-nav-item:hover { color:#d4af37; }
    .bottom-nav-item i { font-size:1.1rem; }
    .bottom-nav-item span { font-family:'Plus Jakarta Sans',sans-serif;font-size:0.6rem; }

    /* Toast */
    .toast-container { position:fixed;bottom:90px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px; }
    .toast { background:#1a1a1e;border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 18px;font-family:'Plus Jakarta Sans',sans-serif;font-size:0.85rem;color:#f3efe6;box-shadow:0 8px 24px rgba(0,0,0,0.5);transition:opacity 0.3s;max-width:300px; }
    .toast.success { border-left:3px solid #25d366; }
    .toast.error { border-left:3px solid #e74c3c; }
    .toast.info { border-left:3px solid #d4af37; }
  </style>
</head>
<body>

<!-- Nav -->
<nav class="track-nav">
  <a href="index.html" class="nav-logo">
    <img src="assets/logo.jpg" alt="Logo">
    <span class="nav-brand">Humu Vault</span>
  </a>
  <div class="nav-spacer"></div>
  <a href="shop.html" class="btn-nav-link"><i class="fa-solid fa-store"></i> Shop</a>
  <a href="cart.html" class="btn-nav-link"><i class="fa-solid fa-bag-shopping"></i> Bag</a>
</nav>

<!-- Main -->
<div class="track-main">
  <div class="track-container">

    <!-- Header -->
    <div class="track-header">
      <div class="track-icon"><i class="fa-solid fa-location-dot"></i></div>
      <h1 class="track-title">Track My Order</h1>
      <p class="track-subtitle">Enter your phone number or order reference to check your order status</p>
    </div>

    <!-- Search Card -->
    <div class="track-search-card">
      <div class="search-tabs">
        <button class="search-tab active" onclick="TrackPage.setTab('phone')"><i class="fa-solid fa-phone"></i> By Phone</button>
        <button class="search-tab" onclick="TrackPage.setTab('ref')"><i class="fa-solid fa-hashtag"></i> By Order Ref</button>
      </div>

      <!-- Phone Pane -->
      <div class="search-pane active" id="phonePane">
        <div class="input-group">
          <i class="fa-solid fa-phone"></i>
          <input class="track-input" type="tel" id="trackPhone" placeholder="+232 76 000000" autocomplete="tel">
        </div>
        <button class="btn-track" onclick="TrackPage.trackByPhone()">
          <i class="fa-solid fa-magnifying-glass"></i> Find My Orders
        </button>
      </div>

      <!-- Ref Pane -->
      <div class="search-pane" id="refPane">
        <div class="input-group">
          <i class="fa-solid fa-hashtag"></i>
          <input class="track-input" type="text" id="trackRef" placeholder="e.g. HKV-ABC123" style="text-transform:uppercase;" autocomplete="off">
        </div>
        <button class="btn-track" onclick="TrackPage.trackByRef()">
          <i class="fa-solid fa-magnifying-glass"></i> Track Order
        </button>
      </div>
    </div>

    <!-- Results area -->
    <div class="track-results" id="trackResults"></div>

    <!-- Help tip -->
    <div class="help-tip" style="margin-top:16px;">
      Can't find your order? <a href="https://wa.me/23277416008?text=Hi! I need help tracking my Humu Kabba Variety Vault order." target="_blank">Message us on WhatsApp</a> with your name and phone number and we'll help you right away 📲
    </div>

  </div>
</div>

<!-- Mobile Bottom Nav -->
<nav class="bottom-nav-bar">
  <a href="index.html" class="bottom-nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
  <a href="shop.html" class="bottom-nav-item"><i class="fa-solid fa-store"></i><span>Shop</span></a>
  <a href="cart.html" class="bottom-nav-item"><i class="fa-solid fa-bag-shopping"></i><span>Bag</span></a>
  <a href="track.html" class="bottom-nav-item active"><i class="fa-solid fa-location-dot"></i><span>Track</span></a>
</nav>

<!-- Toast -->
<div id="toastContainer" class="toast-container"></div>

<script>
(function () {
  'use strict';

  const CFG = window.APP_CONFIG || { BUSINESS: { whatsappNumber: '23277416008' }, isSupabaseConfigured: () => false };
  const WA_NUM = CFG.BUSINESS.whatsappNumber;
  const SLE_TO_USD = 22.50;

  let supabaseClient = null;
  if (typeof window.supabase !== 'undefined' && CFG.isSupabaseConfigured && CFG.isSupabaseConfigured()) {
    try { supabaseClient = window.supabase.createClient(CFG.SUPABASE.url, CFG.SUPABASE.anonKey); } catch(e) {}
  }

  function escHTML(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function showToast(msg, type='info') {
    let c = document.getElementById('toastContainer');
    if (!c) return;
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(() => { t.style.opacity='0'; setTimeout(() => t.remove(), 300); }, 4500);
  }
  function formatSLE(n) { return n ? 'SLE ' + Number(n).toLocaleString('en-SL', {minimumFractionDigits:0,maximumFractionDigits:0}) : 'SLE 0'; }
  function formatDate(d) { if (!d) return '—'; return new Date(d).toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }

  const STATUS_CONFIG = {
    new:        { label:'Order Received',  cls:'status-new',       icon:'fa-inbox',           step:0 },
    confirmed:  { label:'Confirmed',       cls:'status-confirmed', icon:'fa-circle-check',    step:1 },
    preparing:  { label:'Preparing',       cls:'status-preparing', icon:'fa-box-open',        step:2 },
    dispatched: { label:'Out for Delivery',cls:'status-dispatched',icon:'fa-motorcycle',      step:3 },
    delivered:  { label:'Delivered ✅',    cls:'status-delivered', icon:'fa-circle-check',    step:4 },
    cancelled:  { label:'Cancelled',       cls:'status-cancelled', icon:'fa-circle-xmark',    step:-1 },
  };

  const STEPS = [
    { icon:'fa-inbox', label:'Order Received' },
    { icon:'fa-circle-check', label:'Confirmed' },
    { icon:'fa-box-open', label:'Preparing' },
    { icon:'fa-motorcycle', label:'Out for Delivery' },
    { icon:'fa-house-circle-check', label:'Delivered' },
  ];

  function renderProgressBar(currentStep) {
    const pct = currentStep <= 0 ? 0 : Math.min(100, (currentStep / (STEPS.length-1)) * 80);
    return `
      <div class="order-progress">
        <div class="progress-line" style="width:${pct}%;"></div>
        ${STEPS.map((s, i) => `
          <div class="progress-step ${i < currentStep ? 'done' : (i === currentStep ? 'active' : '')}">
            <div class="progress-step-icon"><i class="fa-solid ${s.icon}"></i></div>
            <div class="progress-step-label">${s.label}</div>
          </div>
        `).join('')}
      </div>
    `;
  }

  function renderOrderCard(order) {
    const sc = STATUS_CONFIG[order.status] || STATUS_CONFIG.new;
    const waMsg = `Hi Humu Kabba Variety Vault! 👋\nI'm enquiring about my order:\nRef: ${order.payment_reference || order.id}\nName: ${order.customer_name}\nPhone: ${order.phone}\n\nCould you please give me an update? Thank you!`;

    return `
      <div class="order-card" style="margin-bottom:16px;">
        <div class="order-card-header">
          <div class="order-ref">
            Order <span>${escHTML(order.payment_reference || order.id.slice(0,8).toUpperCase())}</span>
            <div style="font-size:0.75rem;color:rgba(243,239,230,0.4);font-weight:normal;margin-top:2px;">${formatDate(order.created_at)}</div>
          </div>
          <div class="order-status-badge ${sc.cls}"><i class="fa-solid ${sc.icon}"></i> ${sc.label}</div>
        </div>
        <div class="order-card-body">
          ${sc.step >= 0 ? renderProgressBar(sc.step) : ''}
          <div class="order-details-grid">
            <div class="detail-item"><div class="detail-label">Customer</div><div class="detail-value">${escHTML(order.customer_name||'—')}</div></div>
            <div class="detail-item"><div class="detail-label">Phone</div><div class="detail-value">${escHTML(order.phone||'—')}</div></div>
            <div class="detail-item"><div class="detail-label">Payment</div><div class="detail-value">${escHTML((order.payment_method||'—').replace(/_/g,' '))}</div></div>
            <div class="detail-item"><div class="detail-label">Delivery</div><div class="detail-value">${escHTML(order.delivery_address||'Pickup')}</div></div>
          </div>
          <div class="order-items-title">Items</div>
          <div>
            ${(order.product_name||'').split(', ').map(item => `
              <div class="order-item-row">
                <span class="order-item-name">${escHTML(item)}</span>
              </div>
            `).join('')}
          </div>
          <div class="order-total-row">
            <span class="order-total-label">Total</span>
            <span class="order-total-sle">${formatSLE(order.amount)}</span>
          </div>
          <div class="order-contact-btns">
            <a class="btn-wa-contact" href="https://wa.me/${WA_NUM}?text=${encodeURIComponent(waMsg)}" target="_blank">
              <i class="fa-brands fa-whatsapp"></i> Ask for Update
            </a>
            <a class="btn-call-contact" href="tel:+23277416008">
              <i class="fa-solid fa-phone"></i> Call
            </a>
          </div>
        </div>
      </div>
    `;
  }

  function showNoResults(query) {
    const wa = `Hi! I'm looking for my order. Phone/Ref: ${query}. Can you help me track it?`;
    return `
      <div class="no-results">
        <div class="no-results-icon"><i class="fa-solid fa-box-open"></i></div>
        <h3>No orders found</h3>
        <p>No orders were found for <strong>${escHTML(query)}</strong>.<br>Double-check your phone number or order reference.</p>
        <a class="btn-wa-help" href="https://wa.me/${WA_NUM}?text=${encodeURIComponent(wa)}" target="_blank">
          <i class="fa-brands fa-whatsapp"></i> Get Help on WhatsApp
        </a>
      </div>
    `;
  }

  function setLoading(btn, loading) {
    btn.disabled = loading;
    btn.innerHTML = loading ? '<i class="fa-solid fa-spinner fa-spin"></i> Searching…' : '<i class="fa-solid fa-magnifying-glass"></i> ' + (btn.closest('#phonePane') ? 'Find My Orders' : 'Track Order');
  }

  window.TrackPage = {
    activeTab: 'phone',
    setTab(tab) {
      this.activeTab = tab;
      document.querySelectorAll('.search-tab').forEach((el, i) => el.classList.toggle('active', (i===0 && tab==='phone') || (i===1 && tab==='ref')));
      document.getElementById('phonePane')?.classList.toggle('active', tab==='phone');
      document.getElementById('refPane')?.classList.toggle('active', tab==='ref');
      document.getElementById('trackResults').classList.remove('show');
      document.getElementById('trackResults').innerHTML = '';
    },
    async trackByPhone() {
      const phone = document.getElementById('trackPhone')?.value.trim();
      if (!phone || phone.length < 7) { showToast('Please enter a valid phone number', 'error'); return; }
      await this._search('phone', phone);
    },
    async trackByRef() {
      const ref = document.getElementById('trackRef')?.value.trim().toUpperCase();
      if (!ref || ref.length < 4) { showToast('Please enter a valid order reference', 'error'); return; }
      await this._search('ref', ref);
    },
    async _search(type, query) {
      const btn = document.querySelector(`#${type==='phone'?'phonePane':'refPane'} .btn-track`);
      setLoading(btn, true);
      const resultsEl = document.getElementById('trackResults');

      if (!supabaseClient) {
        // No Supabase — redirect to WhatsApp
        resultsEl.innerHTML = showNoResults(query);
        resultsEl.classList.add('show');
        setLoading(btn, false);
        return;
      }

      try {
        let q = supabaseClient.from('orders').select('*').order('created_at', { ascending: false });
        if (type === 'phone') {
          // Match phone with or without country code
          const stripped = query.replace(/^\+232/, '0').replace(/\D/g,'');
          q = q.or(`phone.ilike.%${query}%,phone.ilike.%${stripped}%`);
        } else {
          q = q.or(`payment_reference.eq.${query},id.ilike.${query}%`);
        }
        q = q.limit(5);

        const { data, error } = await q;
        if (error) throw error;

        if (!data || !data.length) {
          resultsEl.innerHTML = showNoResults(query);
        } else {
          resultsEl.innerHTML = `
            <p style="font-family:'Plus Jakarta Sans',sans-serif;font-size:0.85rem;color:rgba(243,239,230,0.4);margin:0 0 16px;">Found ${data.length} order${data.length>1?'s':''}:</p>
            ${data.map(o => renderOrderCard(o)).join('')}
          `;
        }
        resultsEl.classList.add('show');
      } catch(e) {
        console.error(e);
        showToast('Could not search orders. Please try WhatsApp instead.', 'error');
        resultsEl.innerHTML = showNoResults(query);
        resultsEl.classList.add('show');
      }
      setLoading(btn, false);
    }
  };

  // Check URL param
  const urlParams = new URLSearchParams(window.location.search);
  const refParam = urlParams.get('ref');
  if (refParam) {
    document.getElementById('trackRef').value = refParam;
    TrackPage.setTab('ref');
    setTimeout(() => TrackPage.trackByRef(), 400);
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }

})();
</script>
</body>
</html>
